name: CI

on:
  push:
    branches:
      - develop
      - master

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # No services: postgres block: Testcontainers starts and tears down its
      # own PostgreSQL container per test class via the Docker daemon already
      # available on ubuntu-latest, so verify needs nothing pre-provisioned.
      - name: Build and test with Maven
        run: ./mvnw -B clean verify
