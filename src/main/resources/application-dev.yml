spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spring_graphql_db}
    username: ${DB_USERNAME:spring_boot_db}
    password: ${DB_PASSWORD:123456}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,appinfo

logging:
  level:
    com.edgareldy.springgraphqltutorial: DEBUG
