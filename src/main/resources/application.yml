spring:
  application:
    name: spring-graphql-tutorial
  jpa:
    hibernate:
      ddl-auto: validate
  graphql:
    websocket:
      path: /graphql
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-please-override-in-production-0123456789}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000
