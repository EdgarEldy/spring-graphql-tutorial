<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate your account</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 40px auto; padding: 32px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { color: #4F46E5; font-size: 24px; margin: 0; }
        .greeting { font-size: 16px; color: #374151; }
        .message { font-size: 15px; color: #6B7280; line-height: 1.6; }
        .activation-link { display: block; text-align: center; margin-top: 24px; }
        .activation-link a { display: inline-block; padding: 12px 32px; background-color: #4F46E5; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 15px; font-weight: 600; }
        .expiry-notice { margin-top: 24px; padding: 12px 16px; background-color: #FEF3C7; border-radius: 6px; font-size: 13px; color: #92400E; text-align: center; }
        .footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #E5E7EB; font-size: 12px; color: #9CA3AF; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Spring GraphQL Tutorial</h1>
    </div>
    <p class="greeting">Hello <strong th:text="${username}">username</strong>,</p>
    <p class="message">
        Thank you for signing up! Please activate your account by clicking the button below.
    </p>
    <div class="activation-link">
        <a th:href="${activationLink}" target="_blank">Activate my account</a>
    </div>
    <div class="expiry-notice">
        This link expires in <strong>24 hours</strong>. If you did not create an account, you can safely ignore this email.
    </div>
    <div class="footer">
        &copy; 2026 Spring GraphQL Tutorial. All rights reserved.
    </div>
</div>
</body>
</html>
